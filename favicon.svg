<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tanzpaar, weiß auf dem Orange der Seite (bg-primary) -->
  <rect width="64" height="64" rx="12" fill="#f88546"/>
  <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Er: Kopf, Oberkörper, Beine im Schritt -->
    <circle cx="21" cy="14" r="5.5" stroke="none"/>
    <path d="M17 22 L27 22 L26 38 L19 38 Z" stroke-width="2"/>
    <path d="M20 37 L15 56 M25 37 L29 56" fill="none" stroke-width="4.5"/>
    <!-- Sie: Kopf leicht zurückgelehnt, Oberkörper, schwingendes Kleid -->
    <circle cx="44" cy="15" r="5" stroke="none"/>
    <path d="M37 22 L45 23 L42 35 L37 35 Z" stroke-width="2"/>
    <path d="M37 34 L42 34 L53 55 Q42 59 30 56 Z" stroke-width="2"/>
    <!-- Erhobene, gefasste Hände zwischen beiden; sein Arm um ihre Taille -->
    <path d="M18 23 L32 7 L39 23" fill="none" stroke-width="3.5"/>
    <path d="M26 26 L38 30" fill="none" stroke-width="3.5"/>
  </g>
</svg>
